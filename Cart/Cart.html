<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bonge's Amazon Cart</title>
    <link rel="stylesheet" href="Cart.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header>
      <div class="headerDiv">
        <div class="leftSection">
          <a href="..\Front_Page.html" class="frontpage-link">
            <img
              src="..\BAmazonImages/amazon-logo.png"
              alt=""
              class="cartPageAmazonlogo"
            />
          </a>
        </div>

        <div class="midSection">
          Checkout (
          <a href="..\Front_Page.html" class="itemsFrontPageLink">0 Items</a> )
        </div>

        <div class="rightSection">
          <img
            src="..\BAmazonImages/icons/checkout-lock-icon.png"
            alt=""
            class="lockIcon"
          />
        </div>
      </div>
    </header>

    <main>
      <section class="orderReview">
        <span class="orderReviewHeading">Review your order</span>

        <div class="itemCard">
          <div class="deliveryDate">
            Delivery Date: Tuesday, September 22, 2026
          </div>

          <div class="threePartDiv">
            <div class="imageSec">
              <img
                src="..\BAmazonImages/products/athletic-cotton-socks-6-pairs.jpg"
                alt=""
                class="itemCardImage"
              />
            </div>

            <div class="itemDetails">
              <div class="nameOfItem">
                Black and Gray Athletic Cotton Socks - 6 Pairs
              </div>
              <div class="itemPrice">Price: $12.99</div>
              <div class="itemQuantity">
                Quantity: 1
                <span class="updateLink">Update</span>
                <span class="deleteLink">Delete</span>
              </div>
            </div>

            <div class="deliveryOptions">
              <div class="deliveryHeading">Choose a delivery option:</div>

              <div class="deliveryOption">
                <input
                  type="radio"
                  name="deliveryOptionInput"
                  id="deliveryOption1"
                  checked
                />
                <label for="deliveryOption1">Tuesday, September 22</label>
                <span class="shipping">FREE Shipping</span>
              </div>

              <div class="deliveryOption">
                <input
                  type="radio"
                  name="deliveryOptionInput"
                  id="deliveryOption2"
                />
                <label for="deliveryOption2">Wednesday, September 16</label>
                <span class="shipping">$4.99 - Shipping</span>
              </div>

              <div class="deliveryOption">
                <input
                  type="radio"
                  name="deliveryOptionInput"
                  id="deliveryOption3"
                />
                <label for="deliveryOption3">Monday, September 14</label>
                <span class="shipping">$9.99 - Shipping</span>
              </div>
            </div>
          </div>
        </div>
      </section>

      <section class="orderSummary"></section>
    </main>
  </body>
</html>
