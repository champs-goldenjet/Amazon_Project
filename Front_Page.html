<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bonge's Amazon</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="Front_Page.css" />
  </head>
  <body>
    <header>
      <div class="leftSection">
        <a href="Front_Page.html" class="frontPageLink">
          <img
            src="BAmazonImages/amazon-logo-white.png"
            alt="Amazon"
            class="amazonLogo amazonLogoFull"
          />
          <img
            src="BAmazonImages/amazon-mobile-logo-white.png"
            alt="Amazon"
            class="amazonLogo amazonLogoShort"
          />
        </a>
      </div>

      <div class="midSection">
        <input type="text" placeholder="Search" />
        <button class="searchButtonFP">
          <img
            src="BAmazonImages/icons/search-icon.png"
            alt=""
            class="searchIcon"
          />
        </button>
      </div>

      <div class="rightSection">
        <a href="Orders/Orders.html" class="ordersLink">
          <span class="returns">Returns</span>
          <span class="and-orders">& Orders</span>
        </a>

        <a href="Cart/Cart.html" class="cartLink">
          <img src="BAmazonImages/icons/cart-icon.png" alt="" class="cartImg" />
          <div class="cartCount">0</div>
          <div class="cartWord">Cart</div>
        </a>
      </div>
    </header>

    <main>
      <section class="productsSection jsProductsGrid">
        <div class="productContainer">
          <div class="PimageDiv">
            <img
              src="frontPageAssets/intermediate-composite-basketball.jpg"
              alt=""
              class="productImage"
            />
          </div>

          <div class="name-of-product">size 5 basketball</div>

          <div class="ratings">
            <img
              src="BAmazonImages/ratings/rating-40.png"
              alt=""
              class="ratingStars"
            />
            <div class="ratingsCount">127</div>
          </div>

          <div class="price">R 500.00</div>

          <select name="quantity" id="" class="how-many-DUW">
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5">5</option>
          </select>

          <button class="add2CartButton">Add to cart</button>
        </div>
      </section>
    </main>
    <script src="Front_Page.Js"></script>
  </body>
</html>
